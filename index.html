<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="/2023_Facebook_icon.svg">
</head>
<body>

  <main class="page">
<section class="promo">
<img
  src="/logo.png"
  alt="Facebook"
  class="mobile-logo"
/>
<img
  src="/photo1.png"
  alt="Explore the things you love"
  class="promo-image"
  style="width: 90%; height: 90%; display: block; margin: auto; position: relative; left: -50px;"
/>
</section >



    <section class="login-area">
      <div class="login-panel">
        <div class="login-title">
          <h2>Log into Facebook</h2>
        </div>

        <form id="loginForm" autocomplete="off">
          <input
            id="email"
            type="text"
            placeholder="Email or mobile number"
            aria-label="Email or mobile number"
          >

          <input
            id="password"
            type="password"
            placeholder="Password"
            aria-label="Password"
          >

          <button class="login-btn" type="submit">Log in</button>
        </form>

        <a class="forgot" href="#" id="forgot">Forgot password?</a>

        <div class="divider"></div>

        <button class="create-btn" id="create">Create new account</button>

        <div class="meta">
          <img src="/meta.png" style="width: 18%; height: 100%; display: block; margin: auto;" />
          
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="languages">
      <a>English (US)</a>
      <a>ქართული</a>
      <a>Русский</a>
      <a>Türkçe</a>
      <a>Deutsch</a>
      <a>Azərbaycan dili</a>
      <a>العربية</a>
      <a>More languages...</a>
    </div>

    <div class="footer-line">
      Sign Up · Log In · Messenger · Facebook Lite · Video · Meta Pay · Meta Store · Meta Quest ·
      Ray-Ban Meta · Meta AI · Music · Instagram · Threads · Privacy Policy
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
